<!DOCTYPE html>
<html>
<head>
<title>Study AI Explainer</title>
<style>
body{font-family:Arial;background:#eef2f7;margin:0}
header{background:#1d4ed8;color:white;padding:15px;text-align:center}
nav{background:#111;padding:10px;text-align:center}
nav button{margin:5px;padding:10px 15px;border:none;
background:#2563eb;color:white;border-radius:5px;cursor:pointer}
.section{display:none;padding:20px}
.box{background:white;padding:15px;border-radius:10px;margin-bottom:15px}
input{padding:10px;width:90%;margin:5px 0}
.answer{margin-top:10px;color:#065f46;line-height:1.6}
footer{background:#111;color:white;text-align:center;padding:10px}
</style>
</head>

<body>

<header>
<h1>📚 Study AI Explainer</h1>
<p>Ask any subject question • Get clear AI-style explanation</p>
</header>

<nav>
<button onclick="show('login')">Login</button>
<button onclick="show('ask')">Ask Any Question</button>
<button onclick="show('subjects')">Subjects</button>
</nav>

<!-- LOGIN -->
<div id="login" class="section">
<h2>🔐 Login</h2>
<div class="box">
<input id="user" placeholder="Username">
<input id="pass" type="password" placeholder="Password">
<button onclick="login()">Login</button>
<p id="msg"></p>
</div>
</div>

<!-- ASK QUESTION -->
<div id="ask" class="section">
<h2>🤖 Ask Any Question</h2>
<div class="box">
<input id="q" placeholder="Type your question here...">
<button onclick="answer()">Ask</button>
<div id="aiAnswer" class="answer"></div>
</div>
</div>

<!-- SUBJECT LIST -->
<div id="subjects" class="section">
<h2>📘 Subjects Covered</h2>
<div class="box">🧮 Mathematics</div>
<div class="box">⚛ Physics</div>
<div class="box">🧬 Biology</div>
<div class="box">🧪 Chemistry</div>
<div class="box">🌍 Geography</div>
<div class="box">💻 Computer</div>
<div class="box">🏛 History</div>
<div class="box">⚖ Civics</div>
<div class="box">📖 English</div>
</div>

<footer>
© 2025 Study AI Explainer | Learn Clearly 📘
</footer>

<script>
function show(id){
document.querySelectorAll(".section").forEach(s=>s.style.display="none");
document.getElementById(id).style.display="block";
}

function login(){
let u=document.getElementById("user").value;
let p=document.getElementById("pass").value;
document.getElementById("msg").innerText=
(u&&p)?"Login Successful ✅":"Please enter username & password ❌";
}

function answer(){
let q=document.getElementById("q").value.toLowerCase();
let a="Sorry, I could not understand the question. Please try again.";

if(q.includes("area of rectangle"))
a="To find the area of a rectangle, multiply its length and breadth. This tells how much surface the rectangle covers.";

else if(q.includes("newton"))
a="Newton’s laws explain motion. The first law says an object stays at rest or moves uniformly unless an external force acts on it.";

else if(q.includes("photosynthesis"))
a="Photosynthesis is the process by which green plants make food using sunlight, water and carbon dioxide. This food provides energy.";

else if(q.includes("atom"))
a="An atom is the smallest unit of matter. It has protons, neutrons in the nucleus and electrons revolving around it.";

else if(q.includes("latitude"))
a="Latitudes are imaginary lines that run parallel to the equator and help locate places on Earth.";

else if(q.includes("computer"))
a="A computer is an electronic device that takes input, processes data and gives output. It helps in fast calculations.";

else if(q.includes("democracy"))
a="Democracy is a form of government where people elect their leaders by voting.";

else if(q.includes("past tense"))
a="Past tense shows an action that already happened. Example: go → went.";

document.getElementById("aiAnswer").innerText=a;
}
</script>

</body>
</html>
